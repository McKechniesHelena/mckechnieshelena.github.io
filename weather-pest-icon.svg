<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- ===== Thermometer (historic weather) ===== -->
  <!-- mercury, drawn under the outline -->
  <circle cx="23" cy="46" r="6" fill="#e0512f"/>
  <rect x="20" y="27" width="6" height="20" rx="3" fill="#e0512f"/>
  <!-- tube + bulb outline -->
  <path d="M19 12 A4 4 0 0 1 27 12 L27 39 A8 8 0 1 1 19 39 Z"
        fill="none" stroke="#2e6f3e" stroke-width="3" stroke-linejoin="round"/>
  <!-- tick marks -->
  <g stroke="#2e6f3e" stroke-width="2" stroke-linecap="round">
    <line x1="28.5" y1="18" x2="31.5" y2="18"/>
    <line x1="28.5" y1="24" x2="31.5" y2="24"/>
    <line x1="28.5" y1="30" x2="31.5" y2="30"/>
  </g>

  <!-- ===== Beetle (pest modeling) ===== -->
  <g stroke="#1f4e2b" stroke-width="2" stroke-linecap="round">
    <!-- legs -->
    <line x1="44" y1="30" x2="38" y2="28"/>
    <line x1="50" y1="30" x2="56" y2="28"/>
    <line x1="44" y1="35" x2="37" y2="35"/>
    <line x1="50" y1="35" x2="57" y2="35"/>
    <line x1="44" y1="40" x2="38" y2="43"/>
    <line x1="50" y1="40" x2="56" y2="43"/>
    <!-- antennae -->
    <line x1="45" y1="23" x2="42" y2="19"/>
    <line x1="49" y1="23" x2="52" y2="19"/>
  </g>
  <!-- body -->
  <ellipse cx="47" cy="35" rx="8" ry="10.5" fill="#2e6f3e"/>
  <!-- head -->
  <circle cx="47" cy="24" r="3.8" fill="#1f4e2b"/>
  <!-- wing split -->
  <line x1="47" y1="26" x2="47" y2="44" stroke="#1f4e2b" stroke-width="1.6" stroke-linecap="round"/>
  <!-- spots -->
  <g fill="#e7f1e9">
    <circle cx="43.5" cy="32" r="1.5"/>
    <circle cx="50.5" cy="32" r="1.5"/>
    <circle cx="43.5" cy="38" r="1.5"/>
    <circle cx="50.5" cy="38" r="1.5"/>
  </g>
</svg>
